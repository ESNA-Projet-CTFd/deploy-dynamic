{% extends "admin/challenges/create.html" %}
{% block header %}
<div class="alert alert-secondary" role="alert">
    Docker challenges spawn a dedicated container per player. Points decrease dynamically as more players solve them.
</div>
{% endblock %}

{% block category %}
<div class="form-group">
    <label>
        Category:<br>
        <small class="form-text text-muted">
            The category of your challenge
        </small>
    </label>
    <input type="text" class="form-control" name="category" placeholder="Enter challenge category">
</div>
<div class="form-group">
    <label for="DockerImage" id='dockerimage_label'>Docker Image:
        <i class="far fa-question-circle text-muted cursor-help" data-toggle="tooltip" data-placement="right" title="The docker image for your challenge"></i>
    </label>
    <select id="dockerimage_select" name="docker_image" class="form-control" required></select>
</div>
{% endblock %}

{% block value %}
<div class="form-group">
    <label for="initial">Initial Value<br>
        <small class="form-text text-muted">
            This is how many points the challenge is worth initially.
        </small>
    </label>
    <input type="number" class="form-control" name="initial" placeholder="Enter initial value" required>
</div>

<div class="form-group">
    <label for="function">Decay Function<br>
        <small class="form-text text-muted">
            <span>How the dynamic value will be calculated based on the Decay value</span>
            <ul>
                <li>Linear: Calculated as <code>Initial - (Decay * SolveCount)</code></li>
                <li>Logarithmic: Calculated as <code>(((Minimum - Initial) / (Decay^2)) * (SolveCount^2)) + Initial</code></li>
            </ul>
        </small>
    </label>
    <select name="function" class="custom-select">
        <option value="logarithmic">Logarithmic</option>
        <option value="linear">Linear</option>
    </select>
</div>

<div class="form-group">
    <label for="decay">Decay<br>
        <small class="form-text text-muted">
            <ul>
                <li>Linear: Points deducted per solve.</li>
                <li>Logarithmic: Number of solves before reaching the minimum value.</li>
            </ul>
        </small>
    </label>
    <input type="number" class="form-control" name="decay" min="1" placeholder="Enter decay value" required>
</div>

<div class="form-group">
    <label for="minimum">Minimum Value<br>
        <small class="form-text text-muted">
            The lowest value this challenge can reach.
        </small>
    </label>
    <input type="number" class="form-control" name="minimum" placeholder="Enter minimum value" required>
</div>
{% endblock %}

{% block type %}
<input type="hidden" name="type" value="docker" id="chaltype">
{% endblock %}
